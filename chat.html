<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat with Cole</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <div class="bg-white shadow p-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <img src="https://api.dicebear.com/7.x/thumbs/svg?seed=Cole" alt="Cole avatar" class="w-10 h-10 rounded-full border border-gray-300" />
            <h1 class="text-xl font-bold">Chat with Cole</h1>
        </div>
        <form action="/logout" method="get">
            <button type="submit" class="text-red-500 hover:underline">Logout</button>
        </form>
    </div>
    
    <div class="bg-yellow-100 text-yellow-800 px-4 py-2 text-center text-sm font-medium">"Your presence uplifts me. Let's make today meaningful." – Cole</div>
    
    <div id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-2">
        {% for message in history %}
        <div class="max-w-xl {% if message.sender == 'Cole' %}ml-auto bg-blue-100{% else %}mr-auto bg-green-100{% endif %} p-3 rounded-xl shadow">
            <div class="text-sm text-gray-600">{{ message.sender }} <span class="text-xs float-right">{{ message.time }}</span></div>
            <div class="text-base">{{ message.text }}</div>
        </div>
        {% endfor %}
        <div id="typing" class="hidden max-w-xl ml-auto bg-blue-200 p-3 rounded-xl shadow animate-pulse text-sm text-gray-700">Cole is thinking...</div>
    </div>
    
    <form id="chat-form" class="p-4 bg-white shadow flex" method="post">
        <input type="text" id="user-input" name="message" placeholder="Type your message..." class="flex-1 border border-gray-300 rounded-l-xl px-4 py-2 focus:outline-none" />
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-r-xl">Send</button>
    </form><div id="response" class="mt-4 text-gray-800 text-base"></div>
    
    
    <audio id="ping" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" preload="auto"></audio>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
